---

- name: converge
  hosts: all

  pre_tasks:

    - name: show debug information
      ansible.builtin.include_role:
        name: idiv_biodiversity.molecule_helpers.info

    - name: update package cache
      ansible.builtin.include_role:
        name: idiv_biodiversity.molecule_helpers.package_cache

  tasks:

    - name: include the role
      ansible.builtin.include_role:
        name: idiv_biodiversity.security_updates.prometheus_packages_with_fixes
      vars:
        node_exporter_system_group: root
        node_exporter_system_user: root
        node_exporter_textfile_dir: /tmp

...
